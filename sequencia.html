<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfinorte — Sequência de Produção</title>
<style>
:root{
  --fundo:#101c30; --painel:#16233b; --painel-2:#1b2b47; --linha:#26385a;
  --texto:#e8eef8; --texto-fraco:#93a4c0; --ciano:#4fc3f7; --ciano-fraco:#2a5f85;
  --verde:#4ade80; --vermelho:#ff6b6b; --amarelo:#ffc857; --raio:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{background:var(--fundo);color:var(--texto);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:13px;
  display:flex;flex-direction:column;gap:10px;padding:12px 16px}

.topo{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;flex:0 0 auto}
.marca .empresa{font-size:14px;letter-spacing:.16em;color:var(--texto-fraco)}
.marca h1{margin:3px 0 0;font-size:30px;font-weight:300;letter-spacing:.08em;line-height:1}

.etapas{display:flex;gap:9px;margin-left:auto;flex-wrap:wrap}
.etapa{background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);
  padding:7px 17px;min-width:130px;cursor:pointer;text-align:left}
.etapa:hover{border-color:var(--ciano)}
.etapa[aria-pressed=true]{border-color:var(--ciano);background:var(--painel-2)}
.etapa .nome{color:var(--texto-fraco);font-size:11px;letter-spacing:.06em}
.etapa .qtd{font-size:22px;font-weight:600;line-height:1.2;color:var(--ciano)}
.etapa .sub{font-size:10.5px;color:var(--texto-fraco)}

.filtros{flex:0 0 auto;background:var(--painel);border:1px solid var(--linha);
  border-radius:var(--raio);padding:9px 12px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.campo{display:flex;flex-direction:column;gap:3px}
.campo label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-fraco)}
input,select{background:var(--fundo);color:var(--texto);border:1px solid var(--linha);
  border-radius:6px;padding:5px 8px;font:inherit;height:29px;min-width:135px}
input:focus,select:focus{outline:2px solid var(--ciano);outline-offset:1px}
/* ---- filtro de múltipla escolha ---- */
.multi{position:relative}
.multi-btn{width:100%;min-width:150px;height:29px;text-align:left;cursor:pointer;
  background:var(--fundo);color:var(--texto);border:1px solid var(--linha);
  border-radius:6px;padding:5px 24px 5px 8px;font:inherit;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.multi-btn::after{content:"";position:absolute;right:9px;top:12px;
  border:4px solid transparent;border-top-color:var(--texto-fraco)}
.multi-btn:hover{border-color:var(--ciano)}
.multi-btn[aria-expanded=true]{border-color:var(--ciano)}
.multi-btn.ativo{color:var(--ciano);font-weight:600}
.multi-menu{position:absolute;z-index:30;top:32px;left:0;min-width:230px;max-width:330px;
  background:var(--painel-2);border:1px solid var(--ciano);border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);padding:7px}
.multi-menu[hidden]{display:none}
.multi-menu input[type=search]{width:100%;min-width:0;margin-bottom:6px}
.multi-acoes{display:flex;gap:6px;margin-bottom:6px}
.multi-acoes button{flex:1;height:25px;font-size:11.5px;padding:0 6px;
  background:var(--fundo);color:var(--texto-fraco);border:1px solid var(--linha);
  border-radius:5px;cursor:pointer}
.multi-acoes button:hover{border-color:var(--ciano);color:var(--texto)}
.multi-lista{max-height:220px;overflow:auto}
.multi-lista label{display:flex;gap:7px;align-items:center;padding:3px 4px;
  border-radius:4px;cursor:pointer;font-size:12.5px}
.multi-lista label:hover{background:rgba(79,195,247,.1)}
.multi-lista input{min-width:0;height:auto;accent-color:var(--ciano)}
.multi-vazio{padding:10px;text-align:center;color:var(--texto-fraco);font-size:11.5px}

.btn{background:var(--fundo);color:var(--texto-fraco);border:1px solid var(--linha);
  border-radius:6px;padding:5px 13px;font:inherit;height:29px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ciano);color:var(--texto)}
.btn[aria-pressed=true]{background:var(--ciano);border-color:var(--ciano);color:#08172b;font-weight:600}
.btn.primario{background:var(--ciano);border-color:var(--ciano);color:#08172b;font-weight:600}
.btn.primario:hover{filter:brightness(1.1);color:#08172b}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible{outline:2px solid var(--ciano);outline-offset:2px}

.painel{background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
#painelSeq{flex:1 1 50%}
#painelItens{flex:1 1 50%}
.cabeca{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:0 0 auto;
  padding:7px 12px;background:var(--painel-2);border-bottom:1px solid var(--linha)}
.cabeca h2{margin:0;font-size:13.5px;font-weight:500;color:var(--texto-fraco)}
.controles{display:flex;gap:7px;align-items:center;margin-left:auto;flex-wrap:wrap}

.rolagem{flex:1 1 auto;min-height:0;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
thead th{position:sticky;top:0;z-index:2;background:var(--painel-2);color:var(--ciano);
  text-align:left;font-weight:600;padding:7px 9px;border-bottom:1px solid var(--linha);
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
thead th:hover{color:#fff}
.puxador{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;z-index:3}
.puxador:hover{background:var(--ciano)}
tbody td{padding:5px 9px;border-bottom:1px solid rgba(38,56,90,.5);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(79,195,247,.07)}
tbody tr[aria-selected=true]{background:rgba(79,195,247,.18)}
.num{text-align:right;font-variant-numeric:tabular-nums}

.pos{display:inline-block;min-width:26px;text-align:center;border-radius:5px;
  background:var(--painel-2);border:1px solid var(--linha);font-weight:700;
  font-size:11.5px;padding:1px 5px;color:var(--ciano)}
tr:nth-child(1) .pos,tr:nth-child(2) .pos,tr:nth-child(3) .pos{
  background:var(--ciano);color:#08172b;border-color:var(--ciano)}
.espera{font-weight:600}
.espera.alta{color:var(--vermelho)}
.espera.media{color:var(--amarelo)}
.espera.baixa{color:var(--texto-fraco)}
.atraso{color:var(--vermelho);font-weight:600}
.rodando{color:var(--verde);font-weight:600}

.tag{font-weight:600}
.tag.FALTA_CORTAR,.tag.FALTA_DOBRAR,.tag.FALTA_CALANDRAR,.tag.NAO_INICIADO{color:var(--amarelo)}
.tag.EM_CORTE,.tag.EM_DOBRA,.tag.EM_CALANDRA{color:var(--verde)}

.rodape{flex:0 0 auto;padding:5px 12px;color:var(--texto-fraco);font-size:11.5px;
  border-top:1px solid var(--linha)}
.vazio{padding:22px;text-align:center;color:var(--texto-fraco);white-space:normal}
#aviso{flex:0 0 auto;background:#3a2a12;border:1px solid #6b4d1e;color:#ffd08a;
  border-radius:var(--raio);padding:8px 13px;font-size:12.5px;display:none}
</style>
</head>
<body>

<div id="aviso"></div>

<div class="topo">
  <div class="marca">
    <div class="empresa">PERFINORTE</div>
    <h1>Sequência de produção</h1>
  </div>
  <div class="etapas" id="etapas">
    <button class="etapa" data-etapa="PROGRAMAÇÃO" aria-pressed="false">
      <div class="nome">PROGRAMAÇÃO</div><div class="qtd" id="qPROGRAMAÇÃO">–</div>
      <div class="sub" id="sPROGRAMAÇÃO">&nbsp;</div></button>
    <button class="etapa" data-etapa="CORTE" aria-pressed="true">
      <div class="nome">CORTE</div><div class="qtd" id="qCORTE">–</div>
      <div class="sub" id="sCORTE">&nbsp;</div></button>
    <button class="etapa" data-etapa="DOBRA" aria-pressed="false">
      <div class="nome">DOBRA</div><div class="qtd" id="qDOBRA">–</div>
      <div class="sub" id="sDOBRA">&nbsp;</div></button>
    <button class="etapa" data-etapa="CALANDRA" aria-pressed="false">
      <div class="nome">CALANDRA</div><div class="qtd" id="qCALANDRA">–</div>
      <div class="sub" id="sCALANDRA">&nbsp;</div></button>
  </div>
</div>

<div class="filtros">
  <div class="campo"><label>Material</label><div class="multi" id="fMaterial"></div></div>
  <div class="campo"><label>Espessura</label><div class="multi" id="fEspessura"></div></div>
  <div class="campo"><label>Cliente</label><div class="multi" id="fCliente"></div></div>
  <div class="campo"><label for="fDe">Emissão de</label><input type="date" id="fDe" style="color-scheme:dark"></div>
  <div class="campo"><label for="fAte">Emissão até</label><input type="date" id="fAte" style="color-scheme:dark"></div>
  <div class="campo"><label for="fBusca">Pedido, cliente ou item</label><input type="search" id="fBusca" placeholder="Buscar" style="min-width:200px"></div>
  <div class="campo"><label>&nbsp;</label><button class="btn" id="btnAtrasados" aria-pressed="false">Só de pedidos atrasados</button></div>
  <div class="campo"><label>&nbsp;</label><button class="btn" id="btnLimpar">Limpar filtros</button></div>
  <div class="campo"><label>&nbsp;</label><button class="btn primario" id="btnMostrar">Mostrar</button></div>
</div>

<section class="painel" id="painelSeq">
  <div class="cabeca">
    <h2 id="tituloSeq">Sequência por material e espessura</h2>
    <div class="controles">
      <span id="selecionado" style="color:var(--ciano)"></span>
      <button class="btn" data-ordem="fila" aria-pressed="true">Ordem de chegada</button>
      <button class="btn" data-ordem="entrega" aria-pressed="false">Entrega mais próxima</button>
      <button class="btn" id="exportaSeq">Baixar CSV</button>
    </div>
  </div>
  <div class="rolagem">
    <table id="tabSeq">
      <colgroup></colgroup>
      <thead><tr>
        <th data-col="pos" data-larg="55" class="num">#</th>
        <th data-col="material" data-larg="175">Material</th>
        <th data-col="espessura" data-larg="95" class="num">Espessura</th>
        <th data-col="desde" data-larg="120">Na fila desde</th>
        <th data-col="espera" data-larg="90" class="num">Espera</th>
        <th data-col="itens" data-larg="80" class="num">Itens</th>
        <th data-col="pedidos" data-larg="85" class="num">Pedidos</th>
        <th data-col="rodando" data-larg="90" class="num">Rodando</th>
        <th data-col="entrega" data-larg="120">1ª entrega</th>
        <th data-col="atrasados" data-larg="95" class="num">Atrasados</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="rodape"><span id="rodapeSeq"></span></div>
</section>

<section class="painel" id="painelItens">
  <div class="cabeca">
    <h2 id="tituloItens">Itens em sequência</h2>
    <div class="controles"><button class="btn" id="exportaItens">Baixar CSV</button></div>
  </div>
  <div class="rolagem">
    <table id="tabItens">
      <colgroup></colgroup>
      <thead><tr>
        <th data-col="pos" data-larg="55" class="num">#</th>
        <th data-col="Fila_Desde" data-larg="120">Na fila desde</th>
        <th data-col="Pedido_Linha" data-larg="85">Pedido</th>
        <th data-col="Item_Pedido" data-larg="55" class="num">Item</th>
        <th data-col="Cliente" data-larg="200">Cliente</th>
        <th data-col="Produto" data-larg="340">Descrição</th>
        <th data-col="Material" data-larg="130">Material</th>
        <th data-col="Espessura" data-larg="85" class="num">Espessura</th>
        <th data-col="Status_Final_Item" data-larg="130">Situação</th>
        <th data-col="Data_Entrega" data-larg="105">Entrega</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="rodape"><span id="rodapeItens"></span></div>
</section>

<script src="dados_demo.js" onerror="window.DADOS_DEMO=null"></script>
<script>
/* Cole a URL /exec do app da web publicado pelo Apps Script. */
const API_URL = "https://script.google.com/macros/s/AKfycbybVVh11IBaM43rsBFFCUwEehiiPDWe3rWJ2XffRXWE7oqgSMp6HodPsI0kzIEb-Z_XDA/exec";

const ETAPAS = ["PROGRAMAÇÃO", "CORTE", "DOBRA", "CALANDRA"];
const LIMITE = 3000;

/* Situações que significam "já está na máquina", não "esperando". */
const RODANDO = { "EM CORTE": 1, "EM DOBRA": 1, "EM CALANDRA": 1 };

const estado = {
  itens: [], pedidos: {}, hoje: "",
  etapa: "CORTE", ordem: "fila",
  material: [], espessura: [], cliente: [], busca: "", soAtrasados: false,
  de: "", ate: "",
  grupoSel: "",
  ordemSeq: { col: "pos", desc: false },
  ordemItens: { col: "pos", desc: false }
};

/* ------------------------ carregamento ------------------------ */
async function carregar() {
  const b = document.getElementById("btnMostrar");
  b.disabled = true; b.textContent = "Atualizando…";
  esconderAviso();

  let dados = null;
  if (API_URL) {
    try {
      const sep = API_URL.indexOf("?") < 0 ? "?" : "&";
      const r = await fetch(API_URL + sep + "t=" + Date.now(), { redirect: "follow" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      dados = await r.json();
    } catch (e) {
      avisar("Não consegui ler a planilha (" + e.message + "). A URL precisa terminar em /exec"
        + " e a implantação precisa estar como \"Qualquer pessoa\". Mostrando os dados de exemplo.");
    }
  } else {
    avisar("API_URL está vazio em sequencia.html — usando os dados de exemplo embutidos.");
  }

  b.disabled = false; b.textContent = "Mostrar";
  if (!dados) dados = window.DADOS_DEMO;
  if (!dados) { avisar("Nenhuma fonte de dados disponível."); return; }

  estado.hoje = dados.hoje || hojeBrasilia();

  estado.pedidos = {};
  paraObjetos(dados.P).forEach(function (p) { estado.pedidos[String(p.Pedido_Linha)] = p; });

  if (!dados.I || dados.I.cols.indexOf("Fila_Desde") < 0) {
    avisar("A aba Itens_Limpos ainda não tem as colunas Etapa_Fila e Fila_Desde. Cole o "
      + "Codigo.gs novo e rode Atualizar base agora — sem elas não há como sequenciar.");
  }

  estado.itens = paraObjetos(dados.I)
    .filter(function (i) { return ETAPAS.indexOf(i.Etapa_Fila) >= 0; })
    .map(function (i) {
      const p = estado.pedidos[String(i.Pedido_Linha)] || {};
      i.Material = i.Material || "SEM MATERIAL";
      i.Espessura = String(i.Espessura || "").trim();
      i.Fila_Desde = String(i.Fila_Desde || "").trim();
      i.Data_Entrega = p.Data_Entrega || "";
      i.Data_Emissao = p.Data_Emissao || "";
      i.Status_Pedido_Key = p.Status_Pedido_Key || "";
      i.Cliente = i.Cliente || p.Cliente || "";
      return i;
    });

  montarListas();
  render();
}

function paraObjetos(t) {
  if (!t || !t.rows) return [];
  return t.rows.map(function (linha) {
    const o = {};
    t.cols.forEach(function (c, i) { o[c] = linha[i]; });
    return o;
  });
}
function avisar(m) { const e = document.getElementById("aviso"); e.textContent = m; e.style.display = "block"; }
function esconderAviso() { document.getElementById("aviso").style.display = "none"; }

/* --------------------------- filtros --------------------------- */
function filtrados(comEtapa) {
  const busca = estado.busca.toLowerCase();
  return estado.itens.filter(function (i) {
    if (comEtapa && i.Etapa_Fila !== estado.etapa) return false;
    if (estado.material.length && estado.material.indexOf(i.Material) < 0) return false;
    if (estado.espessura.length && estado.espessura.indexOf(i.Espessura) < 0) return false;
    if (estado.cliente.length && estado.cliente.indexOf(i.Cliente) < 0) return false;
    if (estado.soAtrasados && i.Status_Pedido_Key !== "ATRASADO") return false;
    if (estado.de && (!i.Data_Emissao || i.Data_Emissao < estado.de)) return false;
    if (estado.ate && (!i.Data_Emissao || i.Data_Emissao > estado.ate)) return false;
    if (busca && (String(i.Pedido_Linha) + " " + i.Cliente + " " + i.Produto)
      .toLowerCase().indexOf(busca) < 0) return false;
    return true;
  });
}

/* Agrupa por material + espessura e sequencia os grupos.
 * Ordem de chegada: pelo item mais antigo do grupo — o que espera há mais tempo
 * puxa a combinação para a frente da fila (FIFO por apontamento).
 * Item sem apontamento de data vai para o fim, nunca para o começo. */
function sequenciar(itens) {
  const mapa = {};
  itens.forEach(function (i) {
    const k = i.Material + "\u0001" + (i.Espessura || "—");
    let g = mapa[k];
    if (!g) {
      const p = k.split("\u0001");
      g = mapa[k] = { chave: k, material: p[0], espessura: p[1],
        desde: "", entrega: "", itens: 0, rodando: 0, atrasados: 0, pedidos: {} };
    }
    g.itens++;
    g.pedidos[i.Pedido_Linha] = 1;
    if (RODANDO[i.Status_Final_Item]) g.rodando++;
    if (i.Status_Pedido_Key === "ATRASADO") g.atrasados++;
    if (i.Fila_Desde && (!g.desde || i.Fila_Desde < g.desde)) g.desde = i.Fila_Desde;
    if (i.Data_Entrega && (!g.entrega || i.Data_Entrega < g.entrega)) g.entrega = i.Data_Entrega;
  });

  const lista = Object.keys(mapa).map(function (k) {
    const g = mapa[k];
    g.pedidos = Object.keys(g.pedidos).length;
    g.espera = g.desde ? diasDesde(g.desde) : -1;
    return g;
  });

  lista.sort(comparador());
  lista.forEach(function (g, n) { g.pos = n + 1; });
  return lista;
}

/** Quem entra primeiro na máquina. Sem carimbo de hora, entra por último. */
function comparador() {
  const campo = estado.ordem === "entrega" ? "entrega" : "desde";
  return function (a, b) {
    const x = a[campo], y = b[campo];
    if (!x && !y) return a.material < b.material ? -1 : 1;
    if (!x) return 1;
    if (!y) return -1;
    if (x === y) return b.itens - a.itens;
    return x < y ? -1 : 1;
  };
}

/** Data de hoje no fuso de Brasília, usada para medir a espera na fila. */
function hojeBrasilia() {
  return new Date().toLocaleDateString("en-CA", { timeZone: "America/Sao_Paulo" });
}

const diasDesde = function (quando) {
  const d = String(quando).slice(0, 10);
  return Math.max(0, Math.round(
    (new Date(estado.hoje + "T00:00:00Z") - new Date(d + "T00:00:00Z")) / 86400000));
};

/* --------------------------- render ---------------------------- */
function render() {
  // cartões: cada etapa com sua fila e o grupo que está na frente
  ETAPAS.forEach(function (e) {
    const guardado = estado.etapa;
    estado.etapa = e;
    const daEtapa = filtrados(true);
    estado.etapa = guardado;

    texto("q" + e, daEtapa.length || "–");
    const seq = daEtapa.length ? sequenciar(daEtapa) : [];
    texto("s" + e, seq.length
      ? "1º " + seq[0].material + " " + seq[0].espessura
      : "sem fila");
  });

  document.querySelectorAll(".etapa").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.etapa === estado.etapa));
  });

  const itens = filtrados(true);
  const seq = ordenarSe(sequenciar(itens), estado.ordemSeq);
  desenharSeq(seq);

  const detalhe = estado.grupoSel
    ? itens.filter(function (i) { return i.Material + "\u0001" + (i.Espessura || "—") === estado.grupoSel; })
    : itens;

  detalhe.sort(function (a, b) {
    const x = a.Fila_Desde, y = b.Fila_Desde;
    if (!x && !y) return 0;
    if (!x) return 1;
    if (!y) return -1;
    return x < y ? -1 : 1;
  });
  detalhe.forEach(function (i, n) { i.pos = n + 1; });
  desenharItens(ordenarSe(detalhe.slice(), estado.ordemItens));

  texto("tituloSeq", "Sequência de " + estado.etapa.toLowerCase() + " por material e espessura");
  texto("rodapeSeq", seq.length + " combinações na fila de " + estado.etapa.toLowerCase()
    + " · " + itens.length + " itens");
  texto("rodapeItens", detalhe.length + " itens"
    + (detalhe.length > LIMITE ? " — mostrando os " + LIMITE + " primeiros" : ""));

  const p = estado.grupoSel ? estado.grupoSel.split("\u0001") : null;
  texto("selecionado", p ? p[0] + " " + p[1] + " — clique de novo para soltar" : "");
  texto("tituloItens", p ? "Itens de " + p[0] + " " + p[1] + " em sequência" : "Itens em sequência");
}

function desenharSeq(lista) {
  const corpo = document.querySelector("#tabSeq tbody");
  if (!lista.length) { corpo.innerHTML = vazio(10, "Nada nessa fila com os filtros atuais."); return; }

  corpo.innerHTML = lista.map(function (g) {
    const cls = g.espera < 0 ? "baixa" : g.espera > 30 ? "alta" : g.espera > 7 ? "media" : "baixa";
    return '<tr data-chave="' + esc(g.chave) + '"'
      + (g.chave === estado.grupoSel ? ' aria-selected="true"' : "") + ">"
      + '<td class="num"><span class="pos">' + g.pos + "</span></td>"
      + "<td>" + esc(g.material) + "</td>"
      + '<td class="num">' + esc(g.espessura) + "</td>"
      + "<td>" + (g.desde ? br(g.desde) : "sem apontamento") + "</td>"
      + '<td class="num espera ' + cls + '">' + (g.espera < 0 ? "—" : g.espera + "d") + "</td>"
      + '<td class="num">' + g.itens + "</td>"
      + '<td class="num">' + g.pedidos + "</td>"
      + '<td class="num' + (g.rodando ? " rodando" : "") + '">' + (g.rodando || "·") + "</td>"
      + "<td>" + br(g.entrega) + "</td>"
      + '<td class="num' + (g.atrasados ? " atraso" : "") + '">' + (g.atrasados || "·") + "</td></tr>";
  }).join("");
}

function desenharItens(lista) {
  const corpo = document.querySelector("#tabItens tbody");
  if (!lista.length) { corpo.innerHTML = vazio(10, "Nenhum item nessa fila."); return; }

  const partes = [];
  for (let n = 0; n < lista.length && n < LIMITE; n++) {
    const i = lista[n];
    partes.push("<tr>"
      + '<td class="num"><span class="pos">' + i.pos + "</span></td>"
      + "<td>" + br(i.Fila_Desde) + "</td>"
      + "<td>" + esc(i.Pedido_Linha) + "</td>"
      + '<td class="num">' + esc(i.Item_Pedido) + "</td>"
      + '<td title="' + esc(i.Cliente) + '">' + esc(i.Cliente) + "</td>"
      + '<td title="' + esc(i.Produto) + '">' + esc(i.Produto) + "</td>"
      + "<td>" + esc(i.Material) + "</td>"
      + '<td class="num">' + esc(i.Espessura || "—") + "</td>"
      + '<td class="tag ' + chave(i.Status_Final_Item) + '">' + esc(i.Status_Final_Item) + "</td>"
      + '<td class="' + (i.Status_Pedido_Key === "ATRASADO" ? "atraso" : "") + '">'
      + br(i.Data_Entrega) + "</td></tr>");
  }
  corpo.innerHTML = partes.join("");
}

/** Ordenação manual por cabeçalho; "pos" mantém a sequência calculada. */
function ordenarSe(lista, ordem) {
  if (ordem.col === "pos" && !ordem.desc) return lista;
  const c = ordem.col;
  return lista.sort(function (a, b) {
    let x = a[c], y = b[c];
    const nx = parseFloat(String(x).replace(",", ".")), ny = parseFloat(String(y).replace(",", "."));
    if (!isNaN(nx) && !isNaN(ny)) { x = nx; y = ny; }
    if (x === y) return 0;
    return (x > y ? 1 : -1) * (ordem.desc ? -1 : 1);
  });
}

const vazio = function (n, m) { return '<tr><td class="vazio" colspan="' + n + '">' + m + "</td></tr>"; };
const chave = function (s) { return String(s || "").replace(/[ÃÁÀÂ]/g, "A").replace(/\s+/g, "_"); };
const esc = function (s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
};
const br = function (d) {
  d = String(d || "");
  return /^\d{4}-\d{2}-\d{2}/.test(d) ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "—";
};
const texto = function (id, v) { document.getElementById(id).textContent = v; };


/* ==================== filtro de múltipla escolha ====================
 * Nenhuma marcada = todas. Traz busca, "marcar todos" e "limpar".
 */
function MultiFiltro(id, rotulo, aoMudar) {
  const raiz = document.getElementById(id);
  const botao = document.createElement("button");
  botao.className = "multi-btn";
  botao.type = "button";
  botao.setAttribute("aria-expanded", "false");

  const menu = document.createElement("div");
  menu.className = "multi-menu";
  menu.hidden = true;
  menu.innerHTML = '<input type="search" placeholder="Filtrar lista">'
    + '<div class="multi-acoes"><button type="button" data-acao="todos">Marcar todos</button>'
    + '<button type="button" data-acao="limpar">Limpar</button></div>'
    + '<div class="multi-lista"></div>';

  raiz.appendChild(botao);
  raiz.appendChild(menu);

  const busca = menu.querySelector("input");
  const lista = menu.querySelector(".multi-lista");
  let opcoes = [], marcadas = {};

  function rotuloBotao() {
    const n = Object.keys(marcadas).length;
    botao.classList.toggle("ativo", n > 0);
    if (n === 0) return "Todos";
    if (n === 1) return Object.keys(marcadas)[0];
    if (n === opcoes.length) return "Todos (" + n + ")";
    return n + " selecionados";
  }

  function desenhar() {
    const t = busca.value.trim().toLowerCase();
    const visiveis = opcoes.filter(function (o) { return !t || o.toLowerCase().indexOf(t) >= 0; });
    lista.innerHTML = visiveis.length
      ? visiveis.map(function (o) {
        return '<label><input type="checkbox" value="' + escAttr(o) + '"'
          + (marcadas[o] ? " checked" : "") + "><span>" + escAttr(o) + "</span></label>";
      }).join("")
      : '<div class="multi-vazio">Nada encontrado</div>';
    botao.textContent = rotuloBotao();
  }

  botao.onclick = function () {
    const abrir = menu.hidden;
    fecharTodos();
    menu.hidden = !abrir;
    botao.setAttribute("aria-expanded", String(abrir));
    if (abrir) { busca.value = ""; desenhar(); busca.focus(); }
  };

  busca.oninput = desenhar;

  menu.addEventListener("click", function (ev) {
    const acao = ev.target.closest("[data-acao]");
    if (acao) {
      const t = busca.value.trim().toLowerCase();
      const alvo = opcoes.filter(function (o) { return !t || o.toLowerCase().indexOf(t) >= 0; });
      if (acao.dataset.acao === "todos") alvo.forEach(function (o) { marcadas[o] = 1; });
      else alvo.forEach(function (o) { delete marcadas[o]; });
      desenhar();
      aoMudar(selecionadas());
      return;
    }
    const cx = ev.target.closest("input[type=checkbox]");
    if (!cx) return;
    if (cx.checked) marcadas[cx.value] = 1; else delete marcadas[cx.value];
    botao.textContent = rotuloBotao();
    aoMudar(selecionadas());
  });

  function selecionadas() { return Object.keys(marcadas); }

  this.setOpcoes = function (valores) {
    opcoes = valores;
    // descarta seleções que sumiram da base
    Object.keys(marcadas).forEach(function (k) {
      if (valores.indexOf(k) < 0) delete marcadas[k];
    });
    desenhar();
  };
  this.limpar = function () { marcadas = {}; desenhar(); };
  this.fechar = function () { menu.hidden = true; botao.setAttribute("aria-expanded", "false"); };

  MULTIS.push(this);
  desenhar();
}

const MULTIS = [];
function fecharTodos() { MULTIS.forEach(function (m) { m.fechar(); }); }
document.addEventListener("click", function (ev) {
  if (!ev.target.closest(".multi")) fecharTodos();
});
const escAttr = function (s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
};

/* ------------------------ listas dos filtros ------------------- */
const FILTROS = {};

function montarListas() {
  FILTROS.material.setOpcoes(unicos("Material").sort());
  FILTROS.cliente.setOpcoes(unicos("Cliente").sort());
  FILTROS.espessura.setOpcoes(unicos("Espessura").sort(function (a, b) {
    const x = parseFloat(a.replace(",", ".")), y = parseFloat(b.replace(",", "."));
    if (isNaN(x) && isNaN(y)) return a < b ? -1 : 1;   // 'MO' vai para o fim
    if (isNaN(x)) return 1;
    if (isNaN(y)) return -1;
    return x - y;
  }));
}
function unicos(campo) {
  const v = {};
  estado.itens.forEach(function (i) { if (i[campo]) v[i[campo]] = 1; });
  return Object.keys(v);
}

/* --------------------------- interação ------------------------- */
FILTROS.material = new MultiFiltro("fMaterial", "Material", function (v) {
  estado.material = v; estado.grupoSel = ""; render();
});
FILTROS.espessura = new MultiFiltro("fEspessura", "Espessura", function (v) {
  estado.espessura = v; estado.grupoSel = ""; render();
});
FILTROS.cliente = new MultiFiltro("fCliente", "Cliente", function (v) {

});

Object.keys(LIGACOES).forEach(function (id) {

document.getElementById("btnLimpar").onclick = function () {
  Object.keys(LIGACOES).forEach(function (id) {
    document.getElementById(id).value = "";
    estado[LIGACOES[id]] = "";
  });
  ["material", "espessura", "cliente"].forEach(function (k) {
    FILTROS[k].limpar();
    estado[k] = [];
  });
  estado.soAtrasados = false;
  estado.grupoSel = "";
  estado.ordem = "fila";
  estado.ordemSeq = { col: "pos", desc: false };
  estado.ordemItens = { col: "pos", desc: false };
  document.getElementById("btnAtrasados").setAttribute("aria-pressed", "false");
  document.querySelectorAll("[data-ordem]").forEach(function (o) {
    o.setAttribute("aria-pressed", String(o.dataset.ordem === "fila"));
  });
  render();
};

document.getElementById("btnMostrar").onclick = carregar;

function prepararTabela(id, ordem) {
  const tabela = document.getElementById(id);
  const grupo = tabela.querySelector("colgroup");
  tabela.querySelectorAll("thead th").forEach(function (th) {
    const col = document.createElement("col");
    col.style.width = th.dataset.larg + "px";
    grupo.appendChild(col);

    th.style.position = "sticky";
    const puxador = document.createElement("div");
    puxador.className = "puxador";
    th.appendChild(puxador);

    th.addEventListener("click", function (ev) {
      if (ev.target === puxador) return;
      const c = th.dataset.col;
      if (ordem.col === c) ordem.desc = !ordem.desc;
      else { ordem.col = c; ordem.desc = th.classList.contains("num") && c !== "pos"; }
      render();
    });

    puxador.addEventListener("mousedown", function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      const x0 = ev.clientX, l0 = th.getBoundingClientRect().width;
      const mover = function (e) { col.style.width = Math.max(50, l0 + e.clientX - x0) + "px"; };
      const soltar = function () {
        document.removeEventListener("mousemove", mover);
        document.removeEventListener("mouseup", soltar);
        document.body.style.cursor = "";
      };
      document.body.style.cursor = "col-resize";
      document.addEventListener("mousemove", mover);
      document.addEventListener("mouseup", soltar);
    });
  });
}
prepararTabela("tabSeq", estado.ordemSeq);
prepararTabela("tabItens", estado.ordemItens);

document.getElementById("exportaSeq").onclick = function () {
  baixarCSV("sequencia-" + estado.etapa.toLowerCase() + ".csv", sequenciar(filtrados(true)));
};
document.getElementById("exportaItens").onclick = function () {
  const d = filtrados(true).filter(function (i) {
    return !estado.grupoSel || i.Material + "\u0001" + (i.Espessura || "—") === estado.grupoSel;
  });
  baixarCSV("itens-" + estado.etapa.toLowerCase() + ".csv", d);
};

function baixarCSV(nome, lista) {
  if (!lista.length) return;
  const cols = Object.keys(lista[0]).filter(function (c) { return c !== "chave"; });
  const linhas = [cols.join(";")].concat(lista.map(function (o) {
    return cols.map(function (c) {
      return '"' + String(o[c] === undefined ? "" : o[c]).replace(/"/g, '""') + '"';
    }).join(";");
  }));
  const url = URL.createObjectURL(new Blob(["\uFEFF" + linhas.join("\n")], { type: "text/csv" }));
  const a = document.createElement("a");
  a.href = url; a.download = nome; a.click();
  URL.revokeObjectURL(url);
}
